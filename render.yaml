services:
  # ----------------------------------------------------------------------------
  # Backend REST API Service (NestJS Modular Monolith)
  # ----------------------------------------------------------------------------
  - type: web
    name: ausbildung-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run prisma:generate --workspace=apps/api && npm run build --workspace=apps/api
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ausbildung-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://ausbildung-preparation-portal-app.onrender.com,https://ausbildung-preparation-portal.onrender.com,https://ausbildung-web.onrender.com,http://localhost:3000

  # ----------------------------------------------------------------------------
  # Frontend Web Application (Next.js 16)
  # ----------------------------------------------------------------------------
  - type: web
    name: ausbildung-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ausbildung-api.onrender.com/api/v1

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: ausbildung-postgres
    databaseName: ausbildung_portal
    user: ausbildung_admin
    plan: starter
    region: frankfurt
