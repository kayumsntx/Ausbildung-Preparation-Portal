version: '3.8'

services:
  # PostgreSQL primary database
  postgres:
    image: postgres:16-alpine
    container_name: ausbildung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ausbildung_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ausbildung_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for token blacklisting, rate limits, and job queues
  redis:
    image: redis:7-alpine
    container_name: ausbildung-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for local S3-compatible document storage (CVs, cover letters, certificates)
  minio:
    image: minio/minio:latest
    container_name: ausbildung-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local_minio_access_key
      MINIO_ROOT_PASSWORD: local_minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # MailHog for testing local email verification & notifications without real SMTP costs
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ausbildung-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
