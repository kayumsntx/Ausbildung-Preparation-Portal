version: '3.8'

services:
  # ============================================================================
  # 1. CORE DATA SERVICES
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: ausbildung-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-ausbildung_portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ausbildung_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ausbildung-network

  redis:
    image: redis:7-alpine
    container_name: ausbildung-prod-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ausbildung-network

  minio:
    image: minio/minio:latest
    container_name: ausbildung-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local_minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ausbildung-network

  # ============================================================================
  # 2. APPLICATION SERVICES
  # ============================================================================

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ausbildung-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-ausbildung_portal}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_super_secure_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_super_secure_refresh_secret_2026}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-local_minio_access_key}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local_minio_secret_key}
      STORAGE_BUCKET_DOCUMENTS: ausbildung-vault
    ports:
      - "4000:4000"
    networks:
      - ausbildung-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ausbildung-prod-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    networks:
      - ausbildung-network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  ausbildung-network:
    driver: bridge
